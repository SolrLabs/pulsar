name: Bug report
description: Something in Pulsar went wrong, or Pulsar crashed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Read everything below before you submit. Remove names, server
        addresses, or anything else you wouldn't post in public.

        Found a security problem? Please don't file it here. See [SECURITY.md](https://github.com/SolrLabs/pulsar/blob/HEAD/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Pulsar version
      description: Shown in Settings.
      placeholder: "0.4.6, 0.4.7, etc."
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "Windows 11 24H2, Ubuntu 24.04, macOS 15.5, etc."

  - type: input
    id: game
    attributes:
      label: Game
      placeholder: "Valheim, R.E.P.O., Content Warning, etc."

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Installed tab
        2. Click …
        3. …

  - type: textarea
    id: crash
    attributes:
      label: Crash report
      description: If Pulsar showed you a crash report, paste it here. Leave empty otherwise.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Log (optional)
      description: |
        Only if you want to. Logs can list your mods, server names and folder paths, so check before
        you attach. Drag the file in, or paste the relevant lines.
