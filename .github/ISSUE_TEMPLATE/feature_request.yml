name: Feature request
description: Something Pulsar doesn't do yet, or could do better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Read everything below before you submit, including anything
        Pulsar filled in for you.

  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What Pulsar should do.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What it would let you do
      description: What you're trying to do today, and what gets in the way.
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Game
      description: If it's about one game. Filled in when you open this from Pulsar.
      placeholder: "Valheim, R.E.P.O., Content Warning, etc."

  - type: input
    id: version
    attributes:
      label: Pulsar version
      description: Shown in Settings. Filled in when you open this from Pulsar.
      placeholder: "0.4.6, 0.4.7, etc."

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
